# ============================================================
# Bilibili 商品价格监控配置
# ============================================================
#
# 你以后只需要在这里增加商品即可。
#
# condition:
#   type: lte
#   price: 45
#
# 表示：
#     当商品价格 <= 45 元时触发提醒。
#
# 注意：
#     当前用户没有提供提醒邮箱，因此 email.to 留空。
#     程序会正常检查价格，但不会尝试发送邮件。
# ============================================================

email:
  # 留空。
  # 等你以后准备好邮箱时，在这里填写接收提醒的邮箱地址。
  to: "1419211066@qq.com"

  # SMTP 配置不要写密码到这个文件。
  # 实际使用时通过 GitHub Secrets 提供。
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  smtp_user: "3507624840@qq.com"

products:

  # ----------------------------------------------------------
  # 你提供的 Bilibili 会员购商品
  # ----------------------------------------------------------
  - name: "Bilibili 会员购商品 澄闪"

    # 使用 clusterId 调用公开商品详情接口查询当前最低价。
    enabled: true

    url: "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId=10000008690&noTitleBar=1"

    # Bilibili 会员购这个链接中的商品标识。
    cluster_id: "10000008690"

    # 监控价格：
    # 当前价格 <= 45 元时触发提醒。
    condition:
      type: "lte"
      price: 45

    # 价格类型。
    #
    # displayed:
    #     页面当前显示的商品价格。
    #
    # final:
    #     如果以后确认页面存在定金/尾款结构，
    #     可以改成最终应付价格。
    price_type: "displayed"

    # 防止同一个商品在达到目标价格后，
    # 每次 GitHub Actions 运行都重复发送邮件。
    cooldown_hours: 24

  - name: "Bilibili 会员购商品 小司"
    enabled: true
    url: "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId=10000001234&noTitleBar=1"
    cluster_id: "10000001234"
    condition:
      type: "lte"
      price: 45
    price_type: "displayed"
    cooldown_hours: 24

  - name: "Bilibili 会员购商品 唯"
    enabled: true
    url: "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId=10000000940&noTitleBar=1"
    cluster_id: "10000000940"
    condition:
      type: "lte"
      price: 55
    price_type: "displayed"
    cooldown_hours: 24

  - name: "Bilibili 会员购商品 阿梓喵"
    enabled: true
    url: "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId=10000001118&noTitleBar=1"
    cluster_id: "10000001118"
    condition:
      type: "lte"
      price: 55
    price_type: "displayed"
    cooldown_hours: 24

  - name: "Bilibili 会员购商品 波奇"
    enabled: true
    url: "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId=10000009511&noTitleBar=1"
    cluster_id: "10000009511"
    condition:
      type: "lte"
      price: 70
    price_type: "displayed"
    cooldown_hours: 24
