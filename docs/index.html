<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bilibili 会员购商品价格历史">
  <title>Bilibili 商品价格历史</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: light; --primary:#00a1d6; --ink:#172033; --muted:#667085; --line:#e5e9f0; --surface:#fff; --bg:#f4f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { width:min(1120px,calc(100% - 28px)); margin:36px auto; }
    header { margin-bottom:22px; }
    h1 { margin:0 0 4px; font-size:clamp(1.6rem,4vw,2.25rem); }
    .subtitle,.muted { color:var(--muted); }
    .panel { padding:clamp(18px,3vw,28px); border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 12px 35px rgb(20 40 80 / 7%); }
    .controls { display:grid; grid-template-columns:minmax(220px,2fr) repeat(2,minmax(150px,1fr)); gap:16px; }
    label { display:grid; gap:6px; font-weight:650; }
    select { width:100%; padding:10px 12px; border:1px solid #cfd6e2; border-radius:10px; background:#fff; color:var(--ink); font:inherit; }
    .identity { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; margin:22px 0 12px; }
    .identity h2 { margin:0; font-size:1.25rem; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0 20px; }
    .stat { padding:12px 14px; border-radius:12px; background:#f7f9fc; }
    .stat span { display:block; color:var(--muted); font-size:.82rem; }
    .stat strong { font-size:1.15rem; }
    .chart-wrap { position:relative; height:min(52vh,480px); min-height:300px; }
    .message { margin:18px 0 0; padding:12px 14px; border-radius:10px; background:#fff7e8; color:#8a5700; }
    .message.error { background:#fff0f0; color:#a12626; }
    [hidden] { display:none !important; }
    @media (max-width:700px) { main{margin:18px auto}.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.chart-wrap{height:360px}.panel{border-radius:14px} }
  </style>
</head>
<body>
<main>
  <header><h1>Bilibili 商品价格历史</h1><div class="subtitle">所有时间与统计区间均为 Asia/Shanghai（UTC+8）</div></header>
  <section class="panel" aria-busy="true" id="dashboard">
    <div class="controls">
      <label>商品<select id="product-select" disabled></select></label>
      <label>时间单位<select id="granularity-select"><option value="hourly">每小时</option><option value="daily">每天</option></select></label>
      <label>价格指标<select id="metric-select"><option value="max">最高价</option><option value="min">最低价</option><option value="average" selected>平均价</option></select></label>
    </div>
    <div class="identity"><h2 id="product-name">正在加载…</h2><span class="muted" id="product-id"></span></div>
    <div class="muted">数据更新时间：<time id="updated-at">—</time></div>
    <div class="stats" id="stats" hidden>
      <div class="stat"><span>图表最高价</span><strong id="maximum">—</strong></div>
      <div class="stat"><span>图表最低价</span><strong id="minimum">—</strong></div>
      <div class="stat"><span>图表平均价</span><strong id="average">—</strong></div>
    </div>
    <div class="chart-wrap"><canvas id="price-chart" aria-label="商品价格历史折线图"></canvas></div>
    <p class="message" id="message">正在加载价格历史数据…</p>
  </section>
</main>
<script>
'use strict';
const CONFIG = Object.freeze({ dataUrl: './price_history.json', timeZone: 'Asia/Shanghai' });
const METRIC_LABELS = Object.freeze({ max: '最高价', min: '最低价', average: '平均价' });
const elements = {
  dashboard: document.querySelector('#dashboard'), product: document.querySelector('#product-select'),
  granularity: document.querySelector('#granularity-select'), metric: document.querySelector('#metric-select'),
  productName: document.querySelector('#product-name'), productId: document.querySelector('#product-id'),
  updatedAt: document.querySelector('#updated-at'), stats: document.querySelector('#stats'),
  maximum: document.querySelector('#maximum'), minimum: document.querySelector('#minimum'),
  average: document.querySelector('#average'), message: document.querySelector('#message')
};
let products = new Map();
let priceChart = null;
let dataUpdatedAt = null;

async function loadPriceHistory() {
  const response = await fetch(`${CONFIG.dataUrl}?t=${Date.now()}`, { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const payload = await response.json();
  if (!payload || typeof payload.products !== 'object' || Array.isArray(payload.products)) {
    throw new TypeError('价格历史 JSON 格式错误：缺少 products 对象');
  }
  return payload;
}

function normalizeProducts(payload) {
  return new Map(Object.entries(payload.products).map(([stableKey, product]) => {
    if (!product || !product.product_id || !Array.isArray(product.hourly) || !Array.isArray(product.daily)) {
      throw new TypeError(`价格历史 JSON 格式错误：商品 ${stableKey} 数据无效`);
    }
    return [stableKey, product];
  }));
}

function renderProductSelector() {
  elements.product.replaceChildren(...Array.from(products, ([key, product]) =>
    new Option(`${product.name || product.product_id} (${product.product_id})`, key)));
  elements.product.disabled = products.size === 0;
}

function validMetricValues(points, metric) {
  return points.map(point => point[metric]).filter(value => Number.isFinite(value));
}

function formatPrice(value) {
  return Number.isFinite(value) ? `${value.toFixed(2)} 元` : '—';
}

function formatBucket(timestamp, granularity) {
  const options = granularity === 'hourly'
    ? { timeZone: CONFIG.timeZone, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }
    : { timeZone: CONFIG.timeZone, year:'numeric', month:'2-digit', day:'2-digit' };
  return new Intl.DateTimeFormat('zh-CN', options).format(new Date(timestamp));
}

function updateStatistics(values) {
  if (!values.length) { elements.stats.hidden = true; return; }
  elements.maximum.textContent = formatPrice(Math.max(...values));
  elements.minimum.textContent = formatPrice(Math.min(...values));
  elements.average.textContent = formatPrice(values.reduce((sum, value) => sum + value, 0) / values.length);
  elements.stats.hidden = false;
}

function renderChart(product, points, metric, granularity) {
  if (priceChart) priceChart.destroy();
  priceChart = new Chart(document.querySelector('#price-chart'), {
    type:'line', data:{ labels:points.map(point => formatBucket(point.time, granularity)), datasets:[{
      label:`${METRIC_LABELS[metric]}（元）`, data:points.map(point => Number.isFinite(point[metric]) ? point[metric] : null),
      borderColor:'#00a1d6', backgroundColor:'rgb(0 161 214 / 12%)', pointRadius:3, tension:.2, spanGaps:false, fill:true
    }]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
      scales:{x:{title:{display:true,text:'时间（UTC+8）'}},y:{title:{display:true,text:'价格（人民币 / 元）'}}},
      plugins:{tooltip:{callbacks:{label:context => context.parsed.y === null ? '该时间桶无样本' : `${METRIC_LABELS[metric]}：${formatPrice(context.parsed.y)}`}}}
    }
  });
}

function showMessage(text, isError=false) {
  elements.message.textContent = text; elements.message.classList.toggle('error', isError); elements.message.hidden = false;
}

function updateChart() {
  const product = products.get(elements.product.value);
  if (!product) { showMessage('暂无价格历史数据'); return; }
  const granularity = elements.granularity.value;
  const metric = elements.metric.value;
  const points = product[granularity]; // Product selection happens before aggregation data is read.
  elements.productName.textContent = product.name || `商品 ${product.product_id}`;
  elements.productId.textContent = `商品 ID：${product.product_id}（${product.product_type || 'resell'}）`;
  const updatedTimestamp = dataUpdatedAt ? Date.parse(dataUpdatedAt) : NaN;
  elements.updatedAt.textContent = Number.isFinite(updatedTimestamp)
    ? new Date(updatedTimestamp).toLocaleString('zh-CN', {timeZone:CONFIG.timeZone}) : '无记录';
  const values = validMetricValues(points, metric);
  updateStatistics(values);
  renderChart(product, points, metric, granularity);
  if (!values.length) showMessage('暂无价格历史数据'); else elements.message.hidden = true;
}

async function initializeDashboard() {
  try {
    const payload = await loadPriceHistory();
    products = normalizeProducts(payload);
    dataUpdatedAt = payload.updated_at || null;
    renderProductSelector();
    if (!products.size) showMessage('暂无价格历史数据'); else updateChart();
  } catch (error) {
    console.error(error);
    elements.productName.textContent = '数据加载失败';
    showMessage(error instanceof TypeError ? error.message : '无法加载价格历史数据，请稍后重试。', true);
  } finally { elements.dashboard.setAttribute('aria-busy', 'false'); }
}

[elements.product, elements.granularity, elements.metric].forEach(control => control.addEventListener('change', updateChart));
initializeDashboard();
</script>
</body>
</html>
