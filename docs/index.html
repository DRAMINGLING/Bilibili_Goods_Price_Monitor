<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Bilibili 商品价格历史</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><main><h1 id="title">Bilibili 商品价格历史</h1><p id="identity"></p><label>商品 <select id="product"></select></label> <label>时间单位 <select id="granularity"><option value="hourly">按小时</option><option value="daily">按天</option></select></label> <label>指标 <select id="metric"><option value="max">最高价</option><option value="min">最低价</option><option value="average" selected>均价</option></select></label><canvas id="chart"></canvas></main><script>let data,chart;const labels={max:'最高价',min:'最低价',average:'均价'};async function render(){const p=data.products[product.value],m=metric.value,points=p[granularity.value];title.textContent=p.name+' 价格走势';identity.textContent=`${p.product_type} / Cluster ID: ${p.product_id}`;if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:points.map(x=>new Date(x.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})),datasets:[{label:labels[m]+'（元）',data:points.map(x=>x[m]),borderColor:'#00a1d6',spanGaps:false}]},options:{responsive:true,interaction:{intersect:false},scales:{y:{title:{display:true,text:'价格（元）'}}},plugins:{tooltip:{callbacks:{label:c=>c.parsed.y===null?'无数据':`${labels[m]}：¥${c.parsed.y}`}}}}});}fetch('price_history.json').then(r=>r.json()).then(v=>{data=v;Object.entries(data.products).forEach(([key,p])=>product.add(new Option(`${p.name} (${p.product_id})`,key)));if(product.options.length)render()});product.onchange=render;granularity.onchange=render;metric.onchange=render;</script></html>
