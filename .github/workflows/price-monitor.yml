name: Bilibili 商品价格监控

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    concurrency:
      group: price-monitor-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m pytest -q
      - name: 写入前同步价格历史
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch origin
          git pull --rebase origin "$branch"
      - name: 检查价格
        id: price-check
        continue-on-error: true
        env:
          # SMTP 密码只由 GitHub Secret 注入，绝不写入仓库。
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m src.main
      - name: 提交价格历史
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m src.git_sync
      - name: 标记价格检查失败
        if: steps.price-check.outcome == 'failure'
        run: exit 1
