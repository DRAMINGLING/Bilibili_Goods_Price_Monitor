name: Bilibili 商品价格监控

on:
  schedule:
    # GitHub Actions 使用 UTC；每 30 分钟运行一次。
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m pytest -q
      - name: 检查价格
        env:
          # SMTP 密码只由 GitHub Secret 注入，绝不写入仓库。
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m src.main
      - name: 提交价格历史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 数据库在 .gitignore 中排除本地误提交，因此这里明确强制暂存。
          git add -f data/prices.db
          git diff --cached --quiet || git commit -m "chore: update price history"
          git push
