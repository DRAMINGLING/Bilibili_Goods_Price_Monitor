# ============================================================
# Bilibili 商品价格监控
# ============================================================
#
# 功能：
#
# 1. 定时运行 Python 程序
# 2. 检查 config/products.yaml 中的所有商品
# 3. 获取当前价格
# 4. 判断是否达到目标价格
# 5. 如果设置了邮箱，则发送邮件
#
# 当前配置：
#
#     商品：
#     clusterId = 10000008690
#
#     提醒条件：
#     价格 <= 45 元
#
#     邮箱：
#     暂时留空
#
# ============================================================

name: Bilibili Price Monitor


# ------------------------------------------------------------
# 什么时候运行？
# ------------------------------------------------------------
on:

  # GitHub Actions 定时任务。
  #
  # 当前设置为每 30 分钟运行一次。
  #
  # cron 使用 UTC。
  #
  # 中国时间：
  # UTC + 8
  #
  # 注意：
  # GitHub 官方说明 scheduled workflow 在高负载时期
  # 可能出现延迟，因此不要把它当成实时抢购程序。
  schedule:

    - cron: "*/30 * * * *"


  # ----------------------------------------------------------
  # 允许在 GitHub 网页上手动运行。
  # ----------------------------------------------------------
  workflow_dispatch:


# ------------------------------------------------------------
# 权限
# ------------------------------------------------------------
#
# 本程序不需要向 GitHub 写入任何内容。
# 因此只给最小权限。
#
permissions:
  contents: read


jobs:

  monitor:

    # 使用 GitHub 提供的 Ubuntu runner。
    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # 下载 repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 安装 Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # 安装 Python 依赖
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # 运行价格监控程序
      # ------------------------------------------------------
      #
      # SMTP_PASSWORD 来自 GitHub Secrets。
      #
      # 当前没有设置邮箱，因此这个 Secret 也可以暂时不存在。
      #
      # 以后需要邮箱时：
      #
      # Repository
      #   → Settings
      #   → Secrets and variables
      #   → Actions
      #
      # 创建：
      #
      # SMTP_PASSWORD
      #
      # ------------------------------------------------------
      - name: Check Bilibili prices
        env:

          # SMTP 密码从 GitHub Secret 注入。
          #
          # 如果 Secret 不存在，
          # GitHub 会提供空值。
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

        run: |
          cd src
          python main.py


      # ------------------------------------------------------
      # 输出说明
      # ------------------------------------------------------
      - name: Finish
        if: always()
        run: |
          echo "Bilibili price monitoring finished."
